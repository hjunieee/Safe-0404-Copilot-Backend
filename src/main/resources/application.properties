# 데이터베이스 연결 설정
spring.datasource.url=jdbc:h2:mem:safe0404db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔 설정
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA 및 하이버네이트 설정
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 외교부 API 인증 설정 (.env 자동 로드 적용)
openapi.service.key=${DEPT_OPEN_API_KEY:your_actual_service_key_here}
openapi.url.warning=https://apis.data.go.kr/1262000/TravelWarningServiceV3/getTravelWarningListV3
openapi.url.notice=https://apis.data.go.kr/1262000/CountrySafetyService6/getCountrySafetyList6
