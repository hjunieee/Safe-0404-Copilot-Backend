name: Safe 0404 Backend CI/CD Pipeline

on:
  workflow_dispatch: # GitHub Actions 페이지에서 수동으로 실행

jobs:
  build-and-deploy:
    # safe0404 라벨이 붙은 runner에서만 실행 (다른 프로젝트 runner와 격리)
    runs-on: [self-hosted, safe0404]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. 기존 컨테이너 정지 및 제거 (오류 무시)
      - name: Stop and remove existing container
        run: |
          docker stop safe0404-backend || true
          docker rm safe0404-backend || true

      # 2. 서버에서 직접 Docker 이미지 빌드 (로컬 빌드 - Docker Hub 불필요)
      - name: Build Docker image on server
        run: |
          docker build -t safe0404-backend:latest .

      # 3. 새 컨테이너 기동 (환경 변수는 GitHub Secrets에서 주입)
      - name: Run new container
        run: |
          docker run -d \
            --name safe0404-backend \
            -p 8081:8080 \
            -e LITELLM_API_KEY="${{ secrets.LITELLM_API_KEY }}" \
            -e SPRING_PROFILES_ACTIVE=prod \
            --restart always \
            safe0404-backend:latest

      # 4. 미사용 이미지 정리
      - name: Clean up old images
        run: docker image prune -f
