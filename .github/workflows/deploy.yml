name: Safe 0404 Backend CI/CD Pipeline

on:
  workflow_dispatch: # GitHub Actions 페이지에서 수동으로 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Java 및 Gradle 캐시 구성 (빌드 속도 향상)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 2. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker 이미지 빌드 및 푸시
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/safe0404-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/safe0404-backend:latest

      # 4. 운영 서버 SSH 접속 및 컨테이너 갱신 배포
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/safe0404
            docker pull ${{ secrets.DOCKER_USERNAME }}/safe0404-backend:latest
            docker stop safe0404-backend || true
            docker rm safe0404-backend || true
            docker run -d \
              --name safe0404-backend \
              -p 8080:8080 \
              -e LITELLM_API_KEY="${{ secrets.LITELLM_API_KEY }}" \
              -e SPRING_PROFILES_ACTIVE=prod \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/safe0404-backend:latest
            docker image prune -f
